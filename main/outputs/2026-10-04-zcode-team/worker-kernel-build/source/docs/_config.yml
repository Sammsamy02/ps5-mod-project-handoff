title: SharpProspero
description: A C# SDK and toolchain for building application modules that run on the console.

# Published at https://svengdk.github.io/SharpProspero/.
url: https://svengdk.github.io
baseurl: /SharpProspero

# Pinned to a released version so the site builds the same way every time instead of tracking the
# theme's development branch.
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-relative-links

# Rewrite `[text](file.md)` links to the built HTML paths so a local Jekyll build matches the
# GitHub Pages behavior (which enables this plugin by default). Applies to every page — collections
# included — so cross-links resolve wherever they live.
relative_links:
  enabled: true
  collections: true

# Apply the theme's page layout to every page. Setting this here keeps rendering correct no matter how
# the theme is loaded, rather than relying on a default the theme carries in its own configuration.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Default colour scheme. A toggle in the header switches to light and remembers the choice.
color_scheme: dark

# Full-text search over every page, opened with the "s" key.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 4
  preview_words_after: 8
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: 's'

# Navigation and headings.
heading_anchors: true
nav_enabled: true
nav_sort: case_insensitive
nav_error_report: true

# Copy-to-clipboard button on every code block.
enable_copy_code_button: true

# Diagram rendering for the ```mermaid blocks used on the architecture, build, and algorithm pages.
mermaid:
  version: "9.1.7"

# Coloured callouts. Reference a name in markdown with, e.g., {: .note } on the line above a block.
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red
  caution:
    title: Caution
    color: yellow

aux_links:
  View on GitHub:
    - https://github.com/SvenGDK/SharpProspero
aux_links_new_tab: true

footer_content: Copyright &copy; SvenGDK 2026. Distributed under the GPL-3.0-or-later license.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
