; ue4ss/PS5Pad.ini — shared pad-to-keybind mapping profile (rung 5)
; worker-real-input-pad, 2026-10-04.
;
; Staging location: `ue4ss/PS5Pad.ini` under the activated-mod root, staged by
; the same activation bundle that stages ue4ss/Mods/TownfallItemSpawner. It is
; read by ConfigureRetainedPS5PadInput (NativePadInput.cpp:13) through the
; mod source exactly once, during composed-runtime construction, and parsed by
; the retained parse_ps5_pad_config (ue4ss-native-pad-config-1/src/PS5PadConfig.cpp).
;
; Syntax (enforced by the parser, all errors hard refusals with line numbers):
;   [PS5Pad]  User = -1 (first logged-in user) or a specific user id
;   [Bindings] CHORD = MODIFIERS+KEY   (chord components '+'-joined, ASCII only,
;            at most 128 bindings, no chord may contain another configured chord)
;   Buttons: L3 R3 OPTIONS UP RIGHT DOWN LEFT L2 R2 L1 R1 TRIANGLE CIRCLE CROSS
;            SQUARE TOUCH_PAD   (PS5PadConfig.cpp:41-46)
;   Keys: exact UE4SS KeyDef names, e.g. F7 RETURN UP_ARROW DOWN_ARROW
;            LEFT_ARROW RIGHT_ARROW   (string_to_key, KeyDef.cpp:180)
;   Modifiers: SHIFT CONTROL ALT (prefix the key, e.g. "L1 = CONTROL+F5")
;
; Mapping matches worker-real-input INPUT-MAP.md section 1 exactly
; (task wording: CROSS->RETURN, F7 via OPTIONS):
;   Item Spawner main.lua:694-729 registers 6 binds, every callback wrapped in
;   ExecuteInGameThread(...). Pad equivalents:
;     OPTIONS  -> F7           open/close Item Spawner menu (main.lua:694)
;     UP       -> UP_ARROW     selection previous (main.lua:698)
;     DOWN     -> DOWN_ARROW   selection next     (main.lua:703)
;     CROSS    -> RETURN       activate selection / spawn (main.lua:708)
;     LEFT     -> LEFT_ARROW   page previous      (main.lua:713)
;     RIGHT    -> RIGHT_ARROW  page next          (main.lua:722)

[PS5Pad]
User = -1

[Bindings]
OPTIONS = F7
UP = UP_ARROW
DOWN = DOWN_ARROW
CROSS = RETURN
LEFT = LEFT_ARROW
RIGHT = RIGHT_ARROW

; Notes:
; - The mod stays unchanged and recipe-free: it only registers its 6 logical
;   keys; this profile decides which pad chords produce them.
; - Known accepted limitation (documented, not hidden): UE4SS keybinds are
;   non-exclusive notifications; while the menu is open these inputs still
;   reach the game. The mod already compensates game-side
;   (SetIgnoreLookInput/SetIgnoreMoveInput per RUNTIME-REQUIREMENTS C4).
; - The FIRST hardware probe (pad_probe/) deliberately does NOT read this
;   file: it hardcodes a single OPTIONS->F7 binding so the first hardware
;   contact has the fewest moving parts. This file is exercised by the
;   composed runtime path (ConfigureRetainedPS5PadInput) in the SECOND step.
; - Absent file at composed-runtime start = no pad bridge at all
;   (NativePadInput.cpp:14 preserves any supplied input source untouched);
;   present file with a failing provider = runtime start throws
;   (NativePadInput.cpp:19-23) — see HARDWARE-TEST-PLAN.md failure modes.
