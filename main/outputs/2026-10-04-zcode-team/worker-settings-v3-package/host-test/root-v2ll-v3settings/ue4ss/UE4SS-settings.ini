; UE4SS-settings.ini - composed native runtime (PS5) first-run configuration.
; Consumed ONLY from the logical activation key "ue4ss/UE4SS-settings.ini"
; (SettingsManager.cpp:60-68). Every key below is parsed by the retained
; SettingsManager::deserialize; anything unlisted keeps its code default.
; NOTE: no [Overrides] section: native activation refuses non-empty
; ModsFolderPath / ControllingModsTxt (SettingsManager.cpp:112-113) and the
; retained parser wedges on a section that contains only comments.

[General]
bUseUObjectArrayCache=false
SecondsToScanBeforeGivingUp=120
DefaultExecuteInGameThreadMethod=EngineTick
DefaultFNameToStringMethod=Scan

[Debug]
ConsoleEnabled=0
GuiConsoleEnabled=0
GuiConsoleVisible=0
RenderMode=ExternalThread

[CrashDump]
EnableDumping=0

[EngineVersionOverride]
MajorVersion=5
MinorVersion=6
[Hooks]
; A-PI/FLAG-3: both keys REQUIRED 0 - the SINI:1497 gate is (bHookProcessInternal ||
; bHookProcessLocalScriptFunction) and the ProcessLocalScriptFunction sub-derivation (SINI:1516) does
; not re-check its flag, so either key left 1 keeps the init-time ExecuteUbergraph FuncPtr
; jmp-resolve read (SINI:1506) + 164-byte Zydis read (SINI:1527-1555) against game text.
; Lua path unaffected: HookUObjectProcessEvent / HookEngineTick stay default-true; ProcessEvent
; resolves from the vtable (SINI:1448-1456), EngineTick closures still drain per frame.
HookProcessInternal=0
HookProcessLocalScriptFunction=0
