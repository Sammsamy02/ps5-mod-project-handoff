; UE4SS-settings.ini - complete native runtime configuration (PS5).
; All keys present so SettingsManager::deserialize registration never throws.
[Overrides]
ModsFolderPath=
ControllingModsTxt=
[General]
InputSource=
EnableHotReloadSystem=false
HotReloadKey=
EnableAutoReloadingLuaMods=false
UseCache=false
InvalidateCacheIfDLLDiffers=false
EnableDebugKeyBindings=false
SecondsToScanBeforeGivingUp=120
bUseUObjectArrayCache=false
bForceGUObjectArrayForIteration=false
DoEarlyScan=false
bEnableSeachByMemoryAddress=false
DefaultExecuteInGameThreadMethod=EngineTick
DefaultFNameToStringMethod=Scan
[Debug]
ConsoleEnabled=0
GuiConsoleEnabled=0
GuiConsoleVisible=0
GuiConsoleFontScaling=
GuiConsoleMonospaceTextEditors=
GraphicsAPI=
RenderMode=ExternalThread
ToggleGuiKey=
[CrashDump]
EnableDumping=0
FullMemoryDump=0
[EngineVersionOverride]
; [S1][B7] Detect (-1): the engine version is no longer hand-written here. The
; measured version in the per-game profile ([build] engine_major/engine_minor)
; drives Unreal::Version at startup (UE4SSProgram keeps version_finder active
; while major/minor == -1, so BuildFactsChecks settings.version passes via
; version_detect and the profile's measured version is applied). The deploy
; tool emits -1 for every game; it never hand-writes a version.
MajorVersion=-1
MinorVersion=-1
DebugBuild=Detect
Stats=Detect
[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects=false
UseModuleOffsets=false
[CXXHeaderGenerator]
DumpOffsetsAndSizes=false
KeepMemoryLayout=false
LoadAllAssetsBeforeGeneratingCXXHeaders=false
[UHTHeaderGenerator]
IgnoreAllCoreEngineModules=false
IgnoreEngineAndCoreUObject=false
MakeAllFunctionsBlueprintCallable=false
MakeAllPropertyBlueprintsReadWrite=false
MakeEnumClassesBlueprintType=false
MakeAllConfigsEngineConfig=false
[SDKGenerator]
OutputPath=
[Threads]
SigScannerNumThreads=1
SigScannerMultithreadingModuleSizeThreshold=0
[Memory]
MaxMemoryUsageDuringAssetLoading=0
[Hooks]
; A-PI/FLAG-3: both keys REQUIRED 0.
HookProcessInternal=0
HookProcessLocalScriptFunction=0
HookLoadMap=true
HookInitGameState=true
HookCallFunctionByNameWithArguments=false
HookBeginPlay=false
HookEndPlay=false
HookLocalPlayerExec=false
HookAActorTick=false
HookEngineTick=true
EngineTickResolveMethod=EngineTick
HookGameViewportClientTick=false
HookUObjectProcessEvent=true
HookProcessConsoleExec=false
HookUStructLink=false
FExecVTableOffsetInLocalPlayer=0
