[package]
name="patternsleuth_native_engine_version"
version="0.1.0"
edition="2024"
[lib]
crate-type=["staticlib","rlib"]
[dependencies]
scanner={package="native_patternsleuth_scanner",path="scanner-core"}
object={version="=0.32.2",default-features=false,features=["read_core","elf","pe","unaligned"]}
iced-x86={version="=1.21.0",default-features=false,features=["no_std","decoder","instr_info"]}
itertools={version="=0.12.1",default-features=false,features=["use_alloc"]}
lazy_static="=1.5.0"
gimli={version="=0.28.1",default-features=false,features=["read"]}
spin={version="=0.9.8",default-features=false,features=["once"]}
[features]
default=["native-runtime"]
native-runtime=[]
[profile.dev]
panic="abort"
[profile.release]
panic="abort"
[workspace]

[patch.crates-io]
spin={path="vendor/spin-0.9.8"}
